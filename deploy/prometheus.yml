global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8080
