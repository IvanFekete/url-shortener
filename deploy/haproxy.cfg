global
    log stdout format raw local0
    maxconn 4096
defaults
    log global
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 5s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
frontend public
    bind :8080
    http-request deny if { path_beg /metrics /debug }
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 10000 }
    http-request del-header X-Forwarded-For
    option forwardfor
    default_backend api
backend api
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template api 16 api:8080 check resolvers docker init-addr none
